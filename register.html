<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-secondary">
    <div id="menu-container"></div>

    <div class="container">
        <div class="container">

            <div class="row">
                <div class="col-md-6 mx-auto mt-5 bg-light rounded">
                    <div class="h3 text-center	text-primary mt-3 ">Register</div>
                    <div class="mb-3 mt-4">
                        <label class="form-label">Firstname - Lastname</label>
                        <input type="text" class="form-control" id="firstname-lastname" placeholder="Firstname - Lastname">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" id="textDetail" rows="3" placeholder="Address"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Password">
                    </div>

                    <div class="text-end mb-4">
                        <a class="btn btn-link" href="login.html" role="button" style="text-decoration: none;">Login</a>
                        <input type="submit" id="submit" class="btn btn-primary" value="Submit">
                        <input type="reset" id="reset" class="btn btn-secondary" value="Reset">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="js/menu.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
