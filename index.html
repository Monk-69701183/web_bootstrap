<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Index</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
    </head>
    <body>
        <div id="menu-container"></div>
        
        <div class="container">
            <!-- Content here -->
            <h3 class="alert alert-success mt-4">หน้าหลัก</h3>

            <div class="alert alert-primary text-end" role="alert">
                Sittisak Rukpra
            </div>


            <div class="text-end">
                <a class="btn btn-info" href="https://www.google.com/" role="button">Google</a>
            </div>
        </div>


        <!-- แบ่งคอลัมน์ด้วย Grid System -->
        <div class="container text-center mt-4">
            <div class="row">
                <div class="col-md-4 bg-primary-subtle">
                    <img src="images/Samoyed-dog-standing-snow.jpg" class="img-fluid">
                    ซามอย สง่างาม
                </div>
                <div class="col-md-4 bg-success-subtle">
                    <img src="images/Samoyed-dog.jpg" class="img-fluid">
                    ซามอย หน้าตรง
                </div>
                <div class="col-md-4 bg-primary-subtle">
                    <h4 class="mt-3">Register</h4>

                    <form class="text-start mb-3">
                        <div class="mb-3">
                            <label class="form-label">First name</label>
                            <input type="text" class="form-control" id="firstname" placeholder="input firstname" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Last name</label>
                            <input type="text" class="form-control" id="lastname" placeholder="input lastname" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Telephone</label>
                            <input type="tel" class="form-control" id="phone" placeholder="ex. 0123456789" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Province</label>
                            <select class="form-select" id="province">
                                <option selected>Please select...</option>
                                <option value="Chonburi">Chonburi</option>
                                <option value="Rayong">Rayong</option>
                                <option value="Chiangmai">Chiangmai</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" class="form-control" id="e-mail" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="pw" placeholder="input password" required>
                        </div>

                        <div class="d-grid gap-2 d-flex">
                            <button type="submit" class="col btn btn-primary">Submit</button>
                            <button type="reset" class="col btn btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>








        <script src="js/menu.js"></script>
        <script src="js/bootstrap.bundle.min.js"></script>
    </body>
</html>
