<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="container">

            <div class="row">
                <div class="col-md-4 mx-auto mt-5 bg-light rounded">
                    <div class="h3 text-center	text-primary mt-3 ">Login</div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Password">
                    </div>

                    <div class="text-end mb-4">
                        <a class="btn btn-link" href="register.html" role="button" style="text-decoration: none;">Create account</a>
                        <a href="product.html"><input type="submit" id="submit" class="btn btn-primary" value="Login"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="js/menu.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
